[project]
name = "clovers-agent-toolkit"
dynamic = ["version"]
description = ""
authors = [{ name = "KarisAya", email = "karisaya@foxmail.com" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<4.0.0"
dependencies = ["clovers-agent>=0.3.3", "docker>=7.1.0", "trafilatura>=2.2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "clovers_agent_toolkit/__init__.py"

[tool.uv.sources]
clovers-agent = { workspace = true, editable = true }
